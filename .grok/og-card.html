<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a3d3c;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .bg {
        position: absolute;
        inset: -12px;
        background: url("./og-bg.jpg") 70% 36% / cover no-repeat;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 62% 50% at 50% 50%,
            rgba(10, 61, 60, 0.5) 0%,
            rgba(10, 61, 60, 0.16) 54%,
            rgba(19, 32, 38, 0.3) 100%
          ),
          linear-gradient(
            to bottom,
            rgba(19, 32, 38, 0.2) 0%,
            rgba(19, 32, 38, 0) 22%,
            rgba(19, 32, 38, 0) 78%,
            rgba(10, 61, 60, 0.4) 100%
          );
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #f3eee4;
      }
      h1 {
        margin: 0;
        font-family: "Fraunces", "Liberation Serif", serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 132px;
        letter-spacing: 0.07em;
        line-height: 0.92;
        font-variation-settings: "SOFT" 40, "WONK" 0;
        text-shadow:
          0 2px 30px rgba(10, 61, 60, 0.75),
          0 1px 2px rgba(19, 32, 38, 0.5);
      }
      .rule {
        width: 88px;
        height: 1px;
        margin: 20px 0 16px;
        background: #e8f4f3;
        opacity: 0.9;
      }
      p {
        margin: 0;
        font-family: "Outfit", "Liberation Sans", sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: #e8f4f3;
        text-shadow: 0 1px 14px rgba(10, 61, 60, 0.75);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="scrim"></div>
      <div class="lockup">
        <h1>Cuntours</h1>
        <div class="rule"></div>
        <p>Cancún · Riviera Maya</p>
      </div>
    </div>
  </body>
</html>
